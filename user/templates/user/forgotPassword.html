{% extends 'user/base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<span class="text">Forgotten Your Password?</span>
<span>Reset It below</span>

<span>Enter the email you logged in with</span>
<form method="post" id="forgotPasswordForm">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email Address" class="large-input" required>
    <button>Send OTP</button>
</form>



{% endblock %}
